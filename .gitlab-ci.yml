stages:
  - lint
  - build

lint:
  stage: lint
  image: oven/bun:latest
  script:
    - bun install
    - bun run script:lint
  only:
    - merge_requests
    - main

build:
  stage: build
  image: oven/bun:latest
  script:
    - bun install
    - bun run build
  only:
    - merge_requests
    - main
