services:
  wattson:
    profiles: ['production']
    build:
      context: .
      dockerfile: Dockerfile.wattson
      args:
        NODE_ENV: 'production'
    container_name: wattson
    environment:
      - TOKEN=${TOKEN:?err}
      - CLIENT_ID=${CLIENT_ID:?err}
      - APPLICATION_ID=${APPLICATION_ID:?err}
      - NODE_ENV=${NODE_ENV:?err}
      - POSTGRES_HOST=postgres
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - wattson-net
  postgres:
    profiles: ['production', 'development']
    build:
      context: .
      dockerfile: Dockerfile.pg
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:?err}
      BOT_USERNAME: ${BOT_USERNAME:?err}
      BOT_PASSWORD: ${BOT_PASSWORD:?err}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${BOT_USERNAME} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - wattson-net
networks:
  wattson-net:
    driver: bridge
volumes:
  postgres-data:
