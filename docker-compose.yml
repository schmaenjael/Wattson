services:
  # This service is only used in production mode - for development, use `bun run dev` instead and execute it locally
  wattson:
    profiles: ['production']
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: 'production'
    container_name: wattson
    environment:
      - TOKEN=${TOKEN:?err}
      - CLIENT_ID=${CLIENT_ID:?err}
      - APPLICATION_ID=${APPLICATION_ID:?err}
      - GUILD_ID=${GUILD_ID:?err}
      - ADMIN_USER_ID=${ADMIN_USER_ID:?err}
      - NODE_ENV=${NODE_ENV:?err}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:?err}
      - BOT_USERNAME=${BOT_USERNAME:?err}
      - BOT_PASSWORD=${BOT_PASSWORD:?err}
      - HATE_SPEECH_DETECTOR_ENDPOINT=${HATE_SPEECH_DETECTOR_ENDPOINT:-http://hate-speech-detector:8000}
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - RAG_ENDPOINT=${RAG_ENDPOINT:-http://rag:8080}
    depends_on:
      postgres:
        condition: service_healthy
      hate-speech-detector:
        condition: service_healthy
      ollama:
        condition: service_healthy
      rag:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wattson-net
  # RAG service — pgvector retrieval + Ollama grounding for /ask command.
  # Ingests /config/knowledge/ on startup, then serves POST /query on port 8080.
  rag:
    profiles: ['production', 'development']
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    container_name: rag
    environment:
      - RAG_DB_HOST=postgres
      - RAG_DB_PORT=5432
      - RAG_DB_NAME=${POSTGRES_DB:?err}
      - RAG_DB_USER=${RAG_DB_USER:?err}
      - RAG_DB_PASSWORD=${RAG_DB_PASSWORD:?err}
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - SIMILARITY_THRESHOLD=0.7
    volumes:
      - ./config/knowledge:/config/knowledge:ro
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - wattson-net
  # Ollama LLM service — used for court thread summarization.
  # The model is baked into the image at build time (see services/ollama/Dockerfile).
  ollama:
    profiles: ['production', 'development']
    build:
      context: .
      dockerfile: services/ollama/Dockerfile
      args:
        MODEL_NAME: ${OLLAMA_MODEL:-llama3.2:3b}
    container_name: ollama
    ports:
      - '11434:11434'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'ollama list > /dev/null 2>&1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - wattson-net
  # Hate Speech Detection service — wraps sadjava/multilingual-hate-speech-xlm-roberta.
  # Model weights are baked into the image at build time (see services/hate-speech-detector/Dockerfile).
  # Exposes POST /detect on port 8000.
  hate-speech-detector:
    profiles: ['production', 'development']
    build:
      context: .
      dockerfile: services/hate-speech-detector/Dockerfile
    container_name: hate-speech-detector
    ports:
      - '8000:8000'
    volumes:
      - hsd-model-cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - wattson-net
  # This service is used in both production and development modes to run the Postgres database
  postgres:
    profiles: ['production', 'development']
    build:
      context: .
      dockerfile: services/postgres/Dockerfile
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:?err}
      BOT_USERNAME: ${BOT_USERNAME:?err}
      BOT_PASSWORD: ${BOT_PASSWORD:?err}
      RAG_DB_USER: ${RAG_DB_USER:?err}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:?err}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - wattson-net
  # This service is configured for both production and development modes
  pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: pgadmin
    entrypoint: ['/bin/sh', '/pgadmin4/init.sh']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?err}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?err}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: '10'
      TZ: Europe/Berlin
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:?err}
    ports:
      - '15432:80'
    networks:
      - wattson-net
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./services/pgadmin/init.sh:/pgadmin4/init.sh:ro
networks:
  wattson-net:
    driver: bridge
volumes:
  postgres-data:
  pgadmin:
  hsd-model-cache:
